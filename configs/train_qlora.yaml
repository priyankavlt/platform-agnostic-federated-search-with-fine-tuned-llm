# Fine-tuning profiles for the query planner. Pick one with --profile (CLI) or PROFILE (notebook).
# VRAM figures from Unsloth's Qwen3.8 / Qwen3.5 guides.
default_profile: qwen3.8-27b-qlora

profiles:
  # The real run. 4-bit QLoRA needs ~24 GB -> Colab A100 (40 GB) or better.
  qwen3.8-27b-qlora:
    base_model: unsloth/Qwen3.8-27B-unsloth-bnb-4bit
    load_in_4bit: true
    max_seq_length: 1024        # planner prompts are ~600 tokens
    lora_r: 16
    lora_alpha: 32
    epochs: 3
    per_device_batch_size: 1
    grad_accum: 8
    learning_rate: 2.0e-4
    eval_steps: 50
    output_dir: outputs/qwen3.8-27b-planner

  # Smoke test on a free Colab T4 (16 GB). Unsloth advises 16-bit LoRA (not QLoRA) for Qwen3.5.
  qwen3.5-4b-smoke:
    base_model: unsloth/Qwen3.5-4B
    load_in_4bit: false
    max_seq_length: 1024
    lora_r: 16
    lora_alpha: 32
    epochs: 1
    per_device_batch_size: 4
    grad_accum: 2
    learning_rate: 2.0e-4
    eval_steps: 40
    output_dir: outputs/qwen3.5-4b-planner
