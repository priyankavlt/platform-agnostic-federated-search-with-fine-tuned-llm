[project]
name = "fedsearch"
version = "0.1.0"
description = "Platform-agnostic federated natural-language search over heterogeneous sources, powered by a fine-tuned Qwen3.8 model."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pydantic-ai-slim[ag-ui,openai]>=2.70",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "confluent-kafka>=2.5",
    "rich>=13.7",
    "duckdb>=1.1",
    "sqlglot>=25",
]

[project.optional-dependencies]
# Dense embeddings via ONNX (no torch needed).
embed = ["fastembed>=0.4"]
# Run any Airbyte source connector in-process (no Airbyte platform needed).
airbyte = ["airbyte>=0.20"]
# GPU-only: QLoRA fine-tuning. Install on a CUDA box, not on macOS.
train = ["unsloth", "trl>=0.12", "datasets>=3.0", "transformers>=4.51", "peft>=0.13", "bitsandbytes>=0.44"]
serve = ["vllm>=0.8"]

[project.scripts]
fedsearch = "fedsearch.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"
